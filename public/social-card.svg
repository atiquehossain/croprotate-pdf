    <tspan x="72" dy="82">privately.</tspan>
  </text>
  <text x="72" y="441" fill="#9fb1ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="500">Precision edits, entirely in your browser.</text>

