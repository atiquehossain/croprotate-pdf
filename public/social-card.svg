  </defs>
  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <circle cx="1098" cy="72" r="246" fill="#5eead4" opacity="0.055"/>
  <circle cx="1128" cy="626" r="310" fill="#2dd4bf" opacity="0.04"/>

